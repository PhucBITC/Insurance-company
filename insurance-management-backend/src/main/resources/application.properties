# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/insurance_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# Base64 encoded secret key (minimum 256 bits, this is "insuranceCompanyManagementSystemSecretKey2026SecureString")
app.jwt.secret=aW5zdXJhbmNlQ29tcGFueU1hbmFnZW1lbnRTeXN0ZW1TZWNyZXRLZXkyMDI2U2VjdXJlU3RyaW5nCg==
# Expiration: 24 hours in milliseconds (24 * 60 * 60 * 1000)
app.jwt.expiration-ms=86400000

# Groq Cloud AI Chat Configuration
ai.chat.api.key=${GROQ_API_KEY:}
ai.chat.base.url=https://api.groq.com/openai/v1
ai.chat.model=llama-3.3-70b-versatile

# Spring Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

